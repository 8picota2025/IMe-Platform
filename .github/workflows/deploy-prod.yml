name: Deploy Producción

# Solo manual hasta F5: el deploy automático en cada push a main
# publicaría el sitio con catálogo mock y copy EN sin revisar en cuanto
# existan los secretos FTP. Reactivar push/repository_dispatch al cerrar
# F5 (auditoría, legales y despliegue).
on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [trigger-rebuild]

concurrency:
  group: deploy-prod
  # No cancelar un deploy FTP a medias: una cancelación durante la subida deja
  # el estado incremental (.ftp-deploy-sync-state) desincronizado con el servidor
  # y provoca deploys parciales silenciosos. Mejor encolar y ejecutar en serie.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build · Deploy Producción
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: nnfbucwiasuggyfoyydo
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || {
            echo "Falta configurar el secret SUPABASE_DB_URL."
            exit 1
          }
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Falta configurar el secret SUPABASE_ACCESS_TOKEN."
            exit 1
          }
          command -v psql >/dev/null || {
            echo "psql no está disponible en el runner."
            exit 1
          }
          pooler_config="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          pooler_host="$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_host // empty' <<<"$pooler_config")"
          pooler_user="$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_user // empty' <<<"$pooler_config")"
          test -n "$pooler_host" || {
            echo "Management API no devolvió host Session Pooler."
            exit 1
          }
          if [ -z "$pooler_user" ] || [ "$pooler_user" = "postgres" ]; then
            pooler_user="postgres.$SUPABASE_PROJECT_REF"
          fi
          POOLER_DB_URL="$(POOLER_HOST="$pooler_host" POOLER_USER="$pooler_user" node -e '
            const url = new URL(process.env.SUPABASE_DB_URL);
            url.hostname = process.env.POOLER_HOST;
            url.port = "5432";
            url.username = process.env.POOLER_USER;
            url.searchParams.set("sslmode", "require");
            url.searchParams.set("connect_timeout", "10");
            process.stdout.write(url.toString());
          ')"
          if psql "$POOLER_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
            echo "Session Pooler conectado."
            supabase db push --db-url "$POOLER_DB_URL" --include-all --yes
            exit 0
          fi
          echo "::error::No se pudo autenticar con el Session Pooler. No se aplicaron migraciones."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        timeout-minutes: 5
        run: npm run check && npm run build && npm run audit:seo-build && npm run audit:performance-build
        env:
          PUBLIC_SUPABASE_URL: https://nnfbucwiasuggyfoyydo.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5nGmPS2W7yzG3B1NC7piCQ_Imt5f9b2
          REQUIRE_LIVE_DATA: 'true'
          # Solo mirror de imágenes CMS en build (no llega al bundle cliente).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SUPABASE_TIMEOUT_MS: 8000
          PUBLIC_GA_ID: G-YKKFCZHE2N
          PUBLIC_ANALYTICS_DOMAIN: i-me.com.co
          PUBLIC_SEARCH_CONSOLE_VERIFICATION: ${{ secrets.PUBLIC_SEARCH_CONSOLE_VERIFICATION }}
          PUBLIC_SEARCH_CONSOLE_FILE: ${{ secrets.PUBLIC_SEARCH_CONSOLE_FILE }}
          PUBLIC_CLARITY_ID: xqoetpnsk8
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_ASESOR_TURNSTILE: ${{ secrets.PUBLIC_ASESOR_TURNSTILE }}

      - name: Deploy to Hostinger Producción (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_PROD_PATH }}
          timeout: 300000
          # PDFs e imágenes de fabricantes ya viven en Hostinger. Excluirlos
          # evita retransmitir ~604 MB durante la reconstrucción del índice.
          exclude: |
            **/assets/productos/importados/**
            assets/productos/importados/**
          # El estado incremental anterior (.ftp-deploy-sync-state.json) quedó
          # desincronizado con el servidor (deploys cancelados a medias), lo que
          # provocó que se omitieran páginas de producto ya reconstruidas.
          # Un state-name nuevo fuerza una subida completa (no destructiva: no
          # borra archivos del servidor, solo sube/reemplaza) y deja una línea
          # base correcta para los deploys incrementales futuros.
          # v2 quedó contaminado con rutas antiguas y provoca 550 al intentar
          # eliminar carpetas que Hostinger ya no conserva. v3 reconstruye
          # índice remoto limpio tras migración global de URLs.
          state-name: .ftp-deploy-sync-state-v3.json

      - name: Remove legacy PR preview folders
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          PROD_PATH: ${{ secrets.HOSTINGER_PROD_PATH }}
        run: |
          python3 << 'PY'
          import ftplib
          import os
          import re

          host = os.environ["FTP_HOST"].strip()
          host = re.sub(r"^ftp://", "", host).strip("/")
          user = os.environ["FTP_USER"]
          password = os.environ["FTP_PASSWORD"]
          root = os.environ["PROD_PATH"].rstrip("/")
          if not root.startswith("/") or root in ("", "/"):
              raise SystemExit("HOSTINGER_PROD_PATH must be an absolute non-root path")

          def is_dir(ftp, path):
              current = ftp.pwd()
              try:
                  ftp.cwd(path)
                  ftp.cwd(current)
                  return True
              except ftplib.error_perm:
                  return False

          def rmtree(ftp, path):
              current = ftp.pwd()
              ftp.cwd(path)
              names = []
              ftp.retrlines("NLST", names.append)
              for name in names:
                  base = name.rstrip("/").split("/")[-1]
                  if base in (".", "..") or base == "":
                      continue
                  child = name if name.startswith("/") else f"{path.rstrip('/')}/{base}"
                  if is_dir(ftp, child):
                      rmtree(ftp, child)
                  else:
                      ftp.delete(child)
              ftp.cwd(current)
              ftp.rmd(path)

          ftp = ftplib.FTP(host, timeout=120)
          ftp.login(user, password)
          ftp.cwd(root)
          names = []
          ftp.retrlines("NLST", names.append)
          removed = []
          for name in names:
              base = name.rstrip("/").split("/")[-1]
              if not re.fullmatch(r"[0-9]+", base):
                  continue
              target = f"{root}/{base}"
              print(f"Removing preview folder {target}")
              try:
                  rmtree(ftp, target)
                  removed.append(base)
              except ftplib.error_perm as exc:
                  print(f"Skip {target}: {exc}")
          ftp.quit()
          print("Removed preview folders:", ", ".join(removed) if removed else "(none)")
          PY

      - name: Smoke test producción
        env:
          PROD_URL: https://i-me.com.co
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for path in /es/ /es/catalogo/ /es/familias/robots/ /robots.txt /sitemap-index.xml; do
            status="$(curl -L --silent --show-error --fail --output /dev/null --write-out '%{http_code}' "${PROD_URL}${path}")"
            test "$status" = "200"
            echo "OK ${status} ${path}"
          done
          manifest="$(curl -L --silent --show-error --fail "${PROD_URL}/release-manifest.json")"
          echo "$manifest" | grep -Fq "\"commit\": \"${EXPECTED_SHA}\""
          echo "OK release ${EXPECTED_SHA}"
