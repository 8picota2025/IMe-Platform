name: Deploy Supabase Migrations

on:
  workflow_dispatch:

concurrency:
  group: deploy-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply reviewed database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: nnfbucwiasuggyfoyydo
      SUPABASE_DB_POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration target
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || {
            echo "Falta configurar el secret SUPABASE_DB_URL."
            exit 1
          }

      - name: Apply reviewed migrations
        run: |
          set -euo pipefail
          # El host directo del proyecto es IPv6-only. GitHub-hosted runners no
          # tienen ruta IPv6 estable; Session Pooler conserva TLS y usa IPv4.
          POOLER_DB_URL="$(node -e '
            const url = new URL(process.env.SUPABASE_DB_URL);
            url.hostname = process.env.SUPABASE_DB_POOLER_HOST;
            url.username = `postgres.${process.env.SUPABASE_PROJECT_REF}`;
            process.stdout.write(url.toString());
          ')"
          supabase db push --db-url "$POOLER_DB_URL" --include-all --yes
