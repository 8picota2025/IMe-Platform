name: Deploy Supabase Migrations

on:
  workflow_dispatch:

concurrency:
  group: deploy-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply reviewed database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: nnfbucwiasuggyfoyydo
      SUPABASE_DB_POOLER_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration target
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || {
            echo "Falta configurar el secret SUPABASE_DB_URL."
            exit 1
          }

      - name: Apply reviewed migrations
        run: |
          set -euo pipefail
          # El host directo del proyecto es IPv6-only. GitHub-hosted runners no
          # tienen ruta IPv6 estable. El shard de Session Pooler no forma parte
          # del project ref, así que se detecta con una consulta sin imprimir la URL.
          command -v psql >/dev/null || {
            echo "psql no está disponible en el runner."
            exit 1
          }
          POOLER_DB_URL=""
          for shard in 0 1 2 3 4; do
            pooler_host="aws-${shard}-${SUPABASE_DB_POOLER_REGION}.pooler.supabase.com"
            candidate_url="$(POOLER_HOST="$pooler_host" node -e '
              const url = new URL(process.env.SUPABASE_DB_URL);
              url.hostname = process.env.POOLER_HOST;
              url.username = `postgres.${process.env.SUPABASE_PROJECT_REF}`;
              url.searchParams.set("connect_timeout", "5");
              process.stdout.write(url.toString());
            ')"
            if psql "$candidate_url" -X -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
              POOLER_DB_URL="$candidate_url"
              echo "Session Pooler conectado en shard aws-${shard}."
              break
            fi
          done
          test -n "$POOLER_DB_URL" || {
            echo "No fue posible autenticar contra ningún shard Session Pooler."
            exit 1
          }
          supabase db push --db-url "$POOLER_DB_URL" --include-all --yes
