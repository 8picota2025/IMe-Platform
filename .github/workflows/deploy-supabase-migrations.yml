name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-supabase-migrations.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Apply database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: nnfbucwiasuggyfoyydo
      SUPABASE_URL: https://nnfbucwiasuggyfoyydo.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_5nGmPS2W7yzG3B1NC7piCQ_Imt5f9b2
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Configura SUPABASE_ACCESS_TOKEN y SUPABASE_DB_PASSWORD en los secrets del repositorio."
            exit 1
          fi

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        run: supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify CRM schema exposure
        shell: bash
        run: |
          for attempt in {1..6}; do
            status="$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                "$SUPABASE_URL/rest/v1/crm_opportunities?select=id&limit=0" \
                -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
            )"
            if [[ "$status" == "200" ]]; then
              echo "crm_opportunities is available through the Data API."
              exit 0
            fi
            echo "Attempt $attempt: Data API returned HTTP $status; waiting for schema cache refresh."
            sleep 5
          done

          echo "::error::crm_opportunities is still unavailable through the Data API."
          exit 1
