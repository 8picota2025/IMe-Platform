name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nnfbucwiasuggyfoyydo
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Edge Function secrets
        # Solo se envian claves con valor: un GitHub secret ausente interpola a
        # cadena vacia y `secrets set` PISARIA el valor real en produccion
        # (incidentes 2026-07-03 y 2026-07-05).
        run: |
          cat > .secrets.env <<'EOF'
          SITE_URL=${{ secrets.SITE_URL }}
          SUPABASE_URL=https://nnfbucwiasuggyfoyydo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOMPI_PUBLIC_KEY=${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_PRIVATE_KEY=${{ secrets.WOMPI_PRIVATE_KEY }}
          WOMPI_INTEGRITY_SECRET=${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENTS_SECRET=${{ secrets.WOMPI_EVENTS_SECRET }}
          WOMPI_API_BASE=${{ secrets.WOMPI_API_BASE }}
          STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TRANSFERENCIA_BANCO=${{ secrets.TRANSFERENCIA_BANCO }}
          TRANSFERENCIA_TITULAR=${{ secrets.TRANSFERENCIA_TITULAR }}
          TRANSFERENCIA_NIT=${{ secrets.TRANSFERENCIA_NIT }}
          TRANSFERENCIA_TIPO_CUENTA=${{ secrets.TRANSFERENCIA_TIPO_CUENTA }}
          TRANSFERENCIA_NUMERO=${{ secrets.TRANSFERENCIA_NUMERO }}
          TRANSFERENCIA_SWIFT=${{ secrets.TRANSFERENCIA_SWIFT }}
          TRANSFERENCIA_INSTRUCCIONES=${{ secrets.TRANSFERENCIA_INSTRUCCIONES }}
          MAILER_API_KEY=${{ secrets.MAILER_API_KEY }}
          MAILER_FROM=${{ secrets.MAILER_FROM }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          LLM_INGEST_MODEL=${{ secrets.LLM_INGEST_MODEL }}
          LLM_VISION_MODEL=${{ secrets.LLM_VISION_MODEL }}
          OCR_VISION_PROVIDER=${{ secrets.OCR_VISION_PROVIDER }}
          OCR_BRIDGE_URL=${{ secrets.OCR_BRIDGE_URL }}
          OCR_BRIDGE_SECRET=${{ secrets.OCR_BRIDGE_SECRET }}
          OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_VISION_TIMEOUT_MS=${{ secrets.OLLAMA_VISION_TIMEOUT_MS }}
          IMEIA_API_URL=${{ secrets.IMEIA_API_URL }}
          IMEIA_API_KEY=${{ secrets.IMEIA_API_KEY }}
          TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          CANARY_SMOKE_SECRET=${{ secrets.CANARY_SMOKE_SECRET }}
          TWENTY_BASE_URL=${{ secrets.TWENTY_BASE_URL }}
          TWENTY_API_KEY=${{ secrets.TWENTY_API_KEY }}
          TWENTY_OWNER_ID=${{ secrets.TWENTY_OWNER_ID }}
          CRM_DIGEST_TO=${{ secrets.CRM_DIGEST_TO }}
          CRM_DIGEST_SECRET=${{ secrets.CRM_DIGEST_SECRET }}
          REPORTE_SEMANAL_SECRET=${{ secrets.REPORTE_SEMANAL_SECRET }}
          REPORTE_SEMANAL_TO=${{ secrets.REPORTE_SEMANAL_TO }}
          SIIGO_USERNAME=${{ secrets.SIIGO_USERNAME }}
          SIIGO_ACCESS_KEY=${{ secrets.SIIGO_ACCESS_KEY }}
          SIIGO_PARTNER_ID=${{ secrets.SIIGO_PARTNER_ID }}
          SIIGO_DOCUMENT_TYPE_ID=${{ secrets.SIIGO_DOCUMENT_TYPE_ID }}
          SIIGO_SELLER_ID=${{ secrets.SIIGO_SELLER_ID }}
          SIIGO_PAYMENT_TYPE_ID=${{ secrets.SIIGO_PAYMENT_TYPE_ID }}
          SIIGO_ACCOUNT_GROUP_ID=${{ secrets.SIIGO_ACCOUNT_GROUP_ID }}
          SIIGO_TAX_MAP=${{ secrets.SIIGO_TAX_MAP }}
          DIAN_PROVIDER_NAME=${{ secrets.DIAN_PROVIDER_NAME }}
          DIAN_PROVIDER_API_URL=${{ secrets.DIAN_PROVIDER_API_URL }}
          DIAN_PROVIDER_API_TOKEN=${{ secrets.DIAN_PROVIDER_API_TOKEN }}
          DIAN_PROVIDER_METHOD=${{ secrets.DIAN_PROVIDER_METHOD }}
          WHATSAPP_MODE=${{ secrets.WHATSAPP_MODE }}
          CO_DEFAULT_IVA_PCT=19
          GITHUB_TOKEN=${{ secrets.CMS_GITHUB_TOKEN }}
          GITHUB_REPOSITORY=${{ secrets.CMS_GITHUB_REPOSITORY }}
          GITHUB_DISPATCH_EVENT=${{ secrets.CMS_GITHUB_DISPATCH_EVENT }}
          CI_DEPLOY_HOOK=${{ secrets.CI_DEPLOY_HOOK }}
          EOF
          grep -vE '^[A-Z_]+=$' .secrets.env > .secrets.filtered.env
          if [ -s .secrets.filtered.env ]; then
            supabase secrets set --env-file .secrets.filtered.env --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "Sin secrets con valor; se omite secrets set."
          fi

      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          # esm.sh a veces responde 522 al bundlear; reintentar evita deploys atascados.
          ATTEMPTS=3
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "Deploy attempt $i/$ATTEMPTS"
            if supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "Deploy OK"
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Deploy fallo; reintento en 20s…"
              sleep 20
            fi
          done
          echo "Deploy falló tras $ATTEMPTS intentos"
          exit 1
