name: Deploy Preprod

on:
  push:
    branches: [preprod]

concurrency:
  group: deploy-preprod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build · Deploy Preprod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate deployment configuration
        env:
          HOSTINGER_PREPROD_PATH: ${{ secrets.HOSTINGER_PREPROD_PATH }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_PREPROD_PATH" || {
            echo "Falta configurar el secret HOSTINGER_PREPROD_PATH."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://nnfbucwiasuggyfoyydo.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5nGmPS2W7yzG3B1NC7piCQ_Imt5f9b2
          REQUIRE_LIVE_DATA: 'true'
          PUBLIC_GA_ID: G-YKKFCZHE2N
          PUBLIC_ANALYTICS_DOMAIN: i-me.com.co
          PUBLIC_SEARCH_CONSOLE_VERIFICATION: ${{ secrets.PUBLIC_SEARCH_CONSOLE_VERIFICATION }}
          PUBLIC_SEARCH_CONSOLE_FILE: ${{ secrets.PUBLIC_SEARCH_CONSOLE_FILE }}
          PUBLIC_CLARITY_ID: xqoetpnsk8
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Deploy to Hostinger Preprod (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_PREPROD_PATH }}
          dangerous-clean-slate: false
