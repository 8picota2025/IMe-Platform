name: Observabilidad Smoke

on:
  schedule:
    # Cada 15 min: */5 saturaba la cola de runners (jobs queued ~15m → cancelled).
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: observabilidad-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Home · GA4 · Sitemap · Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke checks with retries
        run: |
          set -euo pipefail

          UA='IME-Observability-Smoke/1.0 (+https://github.com/8picota2025/IMe-Platform)'
          MAX_ATTEMPTS=4

          # Hostinger publishes a broken/unreachable AAAA for i-me.com.co. GHA runners
          # often prefer IPv6 and hang until max-time (~30s), which made the old
          # `curl | grep` home check fail with exit 1. Force IPv4 and retry.
          smoke_check() {
            local name="$1"
            local url="$2"
            local pattern="$3"
            local outfile="$4"
            local attempt=1

            while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
              echo "::group::${name} attempt ${attempt}/${MAX_ATTEMPTS}"
              if curl -4 -fsSL \
                --connect-timeout 10 \
                --max-time 30 \
                --retry 2 \
                --retry-delay 2 \
                --retry-all-errors \
                -A "$UA" \
                -o "$outfile" \
                -w "http_code=%{http_code} time=%{time_total} size=%{size_download}\n" \
                "$url"; then
                if grep -q "$pattern" "$outfile"; then
                  echo "${name} OK"
                  echo "::endgroup::"
                  return 0
                fi
                echo "${name} response missing pattern: ${pattern}"
                head -c 800 "$outfile" || true
                echo
              else
                echo "${name} request failed"
              fi
              echo "::endgroup::"
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                sleep $((attempt * 3))
              fi
              attempt=$((attempt + 1))
            done

            echo "::error::${name} check failed after ${MAX_ATTEMPTS} attempts (${url})"
            return 1
          }

          smoke_check "Home" \
            "https://i-me.com.co/" \
            "I-ME" \
            /tmp/home.html

          smoke_check "GA4" \
            "https://i-me.com.co/es/" \
            "G-YKKFCZHE2N" \
            /tmp/home-ga4.html

          smoke_check "Sitemap" \
            "https://i-me.com.co/sitemap-index.xml" \
            "<sitemapindex" \
            /tmp/sitemap.xml

          smoke_check "Health" \
            "https://nnfbucwiasuggyfoyydo.supabase.co/functions/v1/health" \
            '"ok":true' \
            /tmp/health.json

          echo "Health body:"
          cat /tmp/health.json
          echo
