name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [develop, preprod, main]
  pull_request_review:
    types: [submitted]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build · Deploy Preview
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://nnfbucwiasuggyfoyydo.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5nGmPS2W7yzG3B1NC7piCQ_Imt5f9b2
          PUBLIC_GA_ID: G-YKKFCZHE2N
          PUBLIC_ANALYTICS_DOMAIN: i-me.com.co
          PUBLIC_SEARCH_CONSOLE_VERIFICATION: ${{ secrets.PUBLIC_SEARCH_CONSOLE_VERIFICATION }}
          PUBLIC_SEARCH_CONSOLE_FILE: ${{ secrets.PUBLIC_SEARCH_CONSOLE_FILE }}
          PUBLIC_CLARITY_ID: xqoetpnsk8
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_ASESOR_TURNSTILE: ${{ secrets.PUBLIC_ASESOR_TURNSTILE }}
          # La vista previa se sirve en una carpeta del dominio de producción: nunca debe indexarse.
          PUBLIC_NOINDEX: '1'

      - name: Marcar la vista previa como no indexable
        run: |
          # La cabecera X-Robots-Tag sale de la regla de public/.htaccess (SetEnvIf sobre /<PR>/),
          # que ya viaja dentro de dist/.htaccess y cubre también PDF e imágenes. Aquí solo se
          # apaga el robots.txt de la copia (los rastreadores leen el de la raíz; es coherencia).
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Deploy to Hostinger Preview (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_PREVIEW_PATH }}/${{ github.event.pull_request.number }}/
          # Los PDF e imágenes de fabricantes ya viven en producción (la vista previa enlaza a la raíz).
          # Subirlos otra vez en cada PR consume cuota del hosting: ~950 ficheros por preview.
          exclude: |
            **/assets/productos/importados/**
            assets/productos/importados/**
          dangerous-clean-slate: false

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: success()
        env:
          PREVIEW_DOMAIN: ${{ secrets.HOSTINGER_PREVIEW_DOMAIN }}
        with:
          script: |
            const pr = context.issue.number;
            const domain = (process.env.PREVIEW_DOMAIN || '').trim();
            // Sin dominio de vista previa configurado, la copia está en una carpeta numerada del
            // dominio de producción (https://i-me.com.co/<PR>/). Antes la URL salía cortada
            // ("https://preview-<PR>.") por usar un secreto vacío.
            const previewUrl = domain
              ? `https://preview-${pr}.${domain}/es/`
              : `https://i-me.com.co/${pr}/es/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Preview deployment ready: ${previewUrl}\n\nNo indexable (meta robots y cabecera X-Robots-Tag). Los enlaces internos de la copia apuntan a la raíz de producción.`
            })

  cleanup:
    # Al cerrar o fusionar el PR, su vista previa deja de tener sentido y ocupa cuota del hosting
    # (el FTP de producción también comparte cuenta: "Disk quota exceeded" rompía los despliegues).
    name: Limpiar vista previa del PR cerrado
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Borrar carpeta /<PR>/ en el FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          PREVIEW_PATH: ${{ secrets.HOSTINGER_PREVIEW_PATH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Guardas: solo borrar la carpeta numerada de ESA vista previa. Nunca la raíz,
          # ni una ruta con comillas, ni un segmento que no sea el número del PR.
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "Número de PR no válido: $PR_NUMBER"; exit 1 ;; esac
          # El deploy usa server-dir "${HOSTINGER_PREVIEW_PATH}/${PR}/".
          # Con el secreto vacío (lo que hay hoy) eso es "/${PR}/" en la raíz FTP,
          # publicada en https://i-me.com.co/<PR>/. Exigir ruta absoluta aquí hacía
          # fallar el job en cuanto se cerraba un PR, sin borrar nada, y la cuota
          # del hosting se llenaba de vistas previas.
          if [ -z "${PREVIEW_PATH}" ]; then
            target="/${PR_NUMBER}"
          else
            case "$PREVIEW_PATH" in
              /*) ;;
              *) echo "HOSTINGER_PREVIEW_PATH debe ser una ruta absoluta"; exit 1 ;;
            esac
            target="${PREVIEW_PATH%/}/${PR_NUMBER}"
          fi
          case "$target" in
            *\'*|*\"*|*..*|*' '*|*'\\'*) echo "Destino rechazado: caracteres no permitidos"; exit 1 ;;
          esac
          base="${target##*/}"
          parent="${target%/*}"
          # "/251" pierde el padre al quitar el último segmento: el padre es la raíz FTP.
          if [ -z "$parent" ]; then parent="/"; fi
          if [ "$base" != "$PR_NUMBER" ] || [ "$target" = "/" ]; then
            echo "Destino rechazado: $target"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -e "rm -r '$target'; bye" || true
          # cls del directorio padre: el nombre del PR tiene que desaparecer.
          # Un cls del propio directorio lista su contenido y un fallo de lftp
          # en stdout dejaba el job en rojo aunque la carpeta no existiera.
          listing="$(lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -e "set cmd:fail-exit yes; cls -1 '$parent'; bye")"
          if printf '%s\n' "$listing" | grep -Fxq "$PR_NUMBER" || printf '%s\n' "$listing" | grep -Fxq "${PR_NUMBER}/"; then
            echo "La carpeta sigue existiendo: $target"
            exit 1
          fi
          echo "Vista previa eliminada (o inexistente): $target"
