name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, preprod, main]
  pull_request_review:
    types: [submitted]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build · Deploy Preview
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://nnfbucwiasuggyfoyydo.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5nGmPS2W7yzG3B1NC7piCQ_Imt5f9b2
          PUBLIC_GA_ID: G-YKKFCZHE2N
          PUBLIC_ANALYTICS_DOMAIN: i-me.com.co
          PUBLIC_SEARCH_CONSOLE_VERIFICATION: ${{ secrets.PUBLIC_SEARCH_CONSOLE_VERIFICATION }}
          PUBLIC_SEARCH_CONSOLE_FILE: ${{ secrets.PUBLIC_SEARCH_CONSOLE_FILE }}
          PUBLIC_CLARITY_ID: xqoetpnsk8
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_ASESOR_TURNSTILE: ${{ secrets.PUBLIC_ASESOR_TURNSTILE }}
          # La vista previa se sirve en una carpeta del dominio de producción: nunca debe indexarse.
          PUBLIC_NOINDEX: '1'

      - name: Marcar la vista previa como no indexable
        run: |
          # La cabecera X-Robots-Tag sale de la regla de public/.htaccess (SetEnvIf sobre /<PR>/),
          # que ya viaja dentro de dist/.htaccess y cubre también PDF e imágenes. Aquí solo se
          # apaga el robots.txt de la copia (los rastreadores leen el de la raíz; es coherencia).
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Sonda de herencia del noindex (TEMPORAL, solo para validar la regla)
        run: |
          # Imita una vista previa antigua: subcarpeta con su propio .htaccess. Si la regla del
          # .htaccess padre se hereda, /<PR>/__sonda-noindex/sonda.txt sale con X-Robots-Tag.
          mkdir -p dist/__sonda-noindex
          printf 'RewriteEngine On\nRewriteRule ^nunca-existe/?$ /es/ [R=301,L]\n' > dist/__sonda-noindex/.htaccess
          printf 'sonda\n' > dist/__sonda-noindex/sonda.txt

      - name: Deploy to Hostinger Preview (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_PREVIEW_PATH }}/${{ github.event.pull_request.number }}/
          dangerous-clean-slate: false

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: success()
        env:
          PREVIEW_DOMAIN: ${{ secrets.HOSTINGER_PREVIEW_DOMAIN }}
        with:
          script: |
            const pr = context.issue.number;
            const domain = (process.env.PREVIEW_DOMAIN || '').trim();
            // Sin dominio de vista previa configurado, la copia está en una carpeta numerada del
            // dominio de producción (https://i-me.com.co/<PR>/). Antes la URL salía cortada
            // ("https://preview-<PR>.") por usar un secreto vacío.
            const previewUrl = domain
              ? `https://preview-${pr}.${domain}/es/`
              : `https://i-me.com.co/${pr}/es/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Preview deployment ready: ${previewUrl}\n\nNo indexable (meta robots y cabecera X-Robots-Tag). Los enlaces internos de la copia apuntan a la raíz de producción.`
            })
