name: Audit blind +57 phones

# Lectura puntual de teléfonos ya guardados. No modifica filas.
on:
  workflow_dispatch:

jobs:
  audit:
    name: Read-only phone audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Query production phones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: nnfbucwiasuggyfoyydo
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          pooler_config="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          pooler_host="$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_host // empty' <<<"$pooler_config")"
          pooler_user="$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_user // empty' <<<"$pooler_config")"
          test -n "$pooler_host"
          if [ -z "$pooler_user" ] || [ "$pooler_user" = "postgres" ]; then
            pooler_user="postgres.$SUPABASE_PROJECT_REF"
          fi
          POOLER_DB_URL="$(POOLER_HOST="$pooler_host" POOLER_USER="$pooler_user" node -e '
            const url = new URL(process.env.SUPABASE_DB_URL);
            url.hostname = process.env.POOLER_HOST;
            url.port = "5432";
            url.username = process.env.POOLER_USER;
            url.searchParams.set("sslmode", "require");
            url.searchParams.set("connect_timeout", "10");
            process.stdout.write(url.toString());
          ')"
          psql "$POOLER_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null
          psql "$POOLER_DB_URL" -X -v ON_ERROR_STOP=1 -Atq > /tmp/phone-audit-raw.json <<'SQL'
          SELECT COALESCE(json_agg(entry ORDER BY entry.created_at), '[]'::json)
          FROM (
            SELECT
              'leads_comerciales'::text AS source,
              id::text AS id,
              created_at,
              nombre AS name,
              COALESCE(metadata->>'pais', metadata->>'country', metadata->>'telefono_pais', ciudad) AS country,
              telefono AS phone
            FROM leads_comerciales
            WHERE telefono ~ '^\+57'
              AND telefono !~ '^\+573[0-9]{9}$'
              AND telefono !~ '^\+5760[0-9]{8}$'
            UNION ALL
            SELECT
              'crm_contacts'::text,
              id::text,
              created_at,
              trim(concat_ws(' ', nombre, apellido)),
              COALESCE(metadata->>'pais', metadata->>'country', metadata->>'telefono_pais'),
              telefono_e164
            FROM crm_contacts
            WHERE telefono_e164 ~ '^\+57'
              AND telefono_e164 !~ '^\+573[0-9]{9}$'
              AND telefono_e164 !~ '^\+5760[0-9]{8}$'
            UNION ALL
            SELECT
              'solicitudes_cotizacion'::text,
              id::text,
              created_at,
              nombre,
              NULL::text,
              telefono
            FROM solicitudes_cotizacion
            WHERE telefono ~ '^\+57'
              AND telefono !~ '^\+573[0-9]{9}$'
              AND telefono !~ '^\+5760[0-9]{8}$'
          ) AS entry;
          SQL
          node --experimental-strip-types --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { likelyPhoneAfterBlindPrefix } from './src/lib/visitor-phone.ts';
          const rows = JSON.parse(readFileSync('/tmp/phone-audit-raw.json', 'utf8'));
          const list = (Array.isArray(rows) ? rows : []).map(row => ({
            source: row.source,
            id: row.id,
            date: row.created_at,
            name: row.name,
            country: row.country,
            stored_phone: row.phone,
            likely_phone: likelyPhoneAfterBlindPrefix(String(row.phone ?? '')) ?? row.phone,
          }));
          writeFileSync('phone-audit.json', JSON.stringify(list, null, 2));
          console.log(`suspect_rows=${list.length}`);
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: phone-audit
          path: phone-audit.json
          retention-days: 7
