name: CI

# Sin filtro de base: el flujo por fases encadena PRs entre ramas feature
# (fase-N → fase-N+1) y un filtro por rama dejaba esos PRs sin validar.
# "edited" cubre el retarget de base (p. ej. feature/fase-1 → main).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate:
    name: Lint · Check · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno tests (Edge Functions)
        # Estos 4 archivos son unit tests puros (mockean fetch, sin red real).
        # actualizar-fulfillment/test.ts NO está aquí: es un test de
        # integración contra un Supabase local en localhost:54321, requiere
        # su propio harness (supabase start) — fuera de alcance de este gate.
        # --no-check: hay errores de tipos preexistentes en el helper de
        # mocks de twenty-crm.test.ts (TwentyRecord | null), sin relación con
        # la lógica bajo prueba; arreglarlos es un follow-up aparte.
        run: |
          deno test --allow-env --no-check \
            supabase/functions/_shared/twenty-crm.test.ts \
            supabase/functions/_shared/divipola.test.ts \
            supabase/functions/_shared/siigo-client.test.ts \
            supabase/functions/_shared/siigo-mapper.test.ts \
            supabase/functions/_shared/pii-redact.test.ts \
            supabase/functions/_shared/asesor-retention.test.ts

      - name: Security grep — no secrets in src/
        run: |
          echo "Checking for exposed secrets..."
          FOUND=0
          # Se ignoran líneas de comentario (// y bloques *): documentan la
          # política de seguridad y mencionan los nombres sin exponer valores.
          for pattern in service_role SERVICE_KEY ANTHROPIC_API_KEY OPENAI_API_KEY VOYAGE_API_KEY WOMPI_PRIVATE WOMPI_EVENTS_SECRET STRIPE_SECRET STRIPE_WEBHOOK_SECRET TURNSTILE_SECRET; do
            MATCHES=$(grep -rn --include="*.ts" --include="*.astro" --include="*.js" "$pattern" src/ 2>/dev/null | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
            if [ -n "$MATCHES" ]; then
              echo "$MATCHES"
              echo "SECRET FOUND: $pattern"
              FOUND=1
            fi
          done
          if [ $FOUND -ne 0 ]; then exit 1; fi
          echo "No secrets found in src/"

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://nnfbucwiasuggyfoyydo.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5nGmPS2W7yzG3B1NC7piCQ_Imt5f9b2
          PUBLIC_GA_ID: G-YKKFCZHE2N
          PUBLIC_ANALYTICS_DOMAIN: i-me.com.co
          PUBLIC_SEARCH_CONSOLE_VERIFICATION: ${{ secrets.PUBLIC_SEARCH_CONSOLE_VERIFICATION }}
          PUBLIC_SEARCH_CONSOLE_FILE: ${{ secrets.PUBLIC_SEARCH_CONSOLE_FILE }}
          PUBLIC_CLARITY_ID: xqoetpnsk8
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_ASESOR_TURNSTILE: ${{ secrets.PUBLIC_ASESOR_TURNSTILE }}

      - name: SEO build audit
        run: npm run audit:seo-build

      - name: Performance build budget
        run: npm run audit:performance-build
