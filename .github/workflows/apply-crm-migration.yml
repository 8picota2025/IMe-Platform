name: Apply CRM Migration

on:
  push:
    branches:
      - 'cursor/fix-crm-migration-apply-ca28'
      - main
    paths:
      - 'supabase/migrations/20260723040818_crm_normalizado_flujos.sql'
      - 'scripts/apply-supabase-sql.mjs'
      - '.github/workflows/apply-crm-migration.yml'
  workflow_dispatch:

concurrency:
  group: apply-crm-migration
  cancel-in-progress: false

jobs:
  apply:
    name: Apply CRM normalized tables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nnfbucwiasuggyfoyydo
      PUBLIC_SUPABASE_URL: https://nnfbucwiasuggyfoyydo.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5nGmPS2W7yzG3B1NC7piCQ_Imt5f9b2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Apply CRM migration via Management API
        run: node scripts/apply-supabase-sql.mjs supabase/migrations/20260723040818_crm_normalizado_flujos.sql

      - name: Verify CRM tables are exposed
        run: |
          set -euo pipefail
          sleep 3
          for table in crm_opportunities crm_contacts crm_accounts crm_activities; do
            echo "Checking $table..."
            code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
              -H "apikey: ${PUBLIC_SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${PUBLIC_SUPABASE_ANON_KEY}" \
              "${PUBLIC_SUPABASE_URL}/rest/v1/${table}?select=id&limit=0")
            body=$(cat /tmp/verify.json)
            # anon may be denied by RLS (401/403) but must NOT be PGRST205 missing table
            if echo "$body" | grep -q 'PGRST205\|schema cache'; then
              echo "FAIL: $table still missing from schema cache ($code): $body"
              exit 1
            fi
            echo "OK: $table reachable at HTTP $code"
          done

          # Authenticated-less probe of FK columns on operational tables
          for pair in \
            'solicitudes_cotizacion?select=crm_opportunity_id' \
            'pedidos?select=crm_opportunity_id'
          do
            code=$(curl -sS -o /tmp/col.json -w '%{http_code}' \
              -H "apikey: ${PUBLIC_SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${PUBLIC_SUPABASE_ANON_KEY}" \
              "${PUBLIC_SUPABASE_URL}/rest/v1/${pair}&limit=0")
            body=$(cat /tmp/col.json)
            if echo "$body" | grep -qi 'does not exist\|PGRST204\|PGRST205'; then
              echo "FAIL column probe ${pair}: $code $body"
              exit 1
            fi
            echo "OK column probe ${pair}: HTTP $code"
          done
