name: Sync DIAN secrets to GitHub

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  sync:
    name: Mirror Supabase DIAN secrets into GitHub Actions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nnfbucwiasuggyfoyydo
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase auth
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Export DIAN secrets from Supabase (names + values)
        id: export
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets" \
            -o /tmp/supabase-secrets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/supabase-secrets.json").read_text())
          items = data if isinstance(data, list) else data.get("secrets") or data.get("data") or []
          names = sorted(
            str(item.get("name") or item.get("key") or "")
            for item in items
            if isinstance(item, dict)
          )
          print("supabase_secret_names:", ", ".join(n for n in names if n))
          wanted = {
            "DIAN_PROVIDER_NAME",
            "DIAN_PROVIDER_API_URL",
            "DIAN_PROVIDER_API_TOKEN",
            "DIAN_PROVIDER_METHOD",
          }
          found = {}
          for item in items:
            if not isinstance(item, dict):
              continue
            name = item.get("name") or item.get("key")
            if name not in wanted:
              continue
            value = item.get("value") or item.get("secret") or ""
            if value:
              found[name] = value
          missing = sorted(wanted - set(found.keys()))
          if missing:
            print("Missing or empty in Supabase:", ", ".join(missing))
          for key, value in found.items():
            path = f"/tmp/{key}"
            Path(path).write_text(value, encoding="utf-8")
            print(f"exported:{key}")
          PY

      - name: Upsert GitHub repository secrets
        run: |
          set -euo pipefail
          synced=0
          for key in DIAN_PROVIDER_NAME DIAN_PROVIDER_API_URL DIAN_PROVIDER_API_TOKEN DIAN_PROVIDER_METHOD; do
            file="/tmp/${key}"
            if [ -s "$file" ]; then
              gh secret set "$key" --repo "$GITHUB_REPOSITORY" < "$file"
              echo "synced:$key"
              synced=$((synced + 1))
            fi
          done
          if [ "$synced" -eq 0 ]; then
            echo "No DIAN_PROVIDER_* con valor en Supabase. Configúralos en el dashboard y reintenta."
            exit 1
          fi
