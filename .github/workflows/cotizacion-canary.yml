name: Cotización Canary

# Flujo crítico: solicitud de cotización (contacto + modal navbar + emails).
# Corre tras deploy web o Edge, y cada 6 h como red de seguridad; el minuto 17
# evita coincidir con otros workflows programados.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Producción
      - Deploy Supabase Functions
    types: [completed]

concurrency:
  group: cotizacion-canary
  cancel-in-progress: true

jobs:
  canary:
    name: Contacto · Modal · Edge · Emails
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Wait for CDN / FTP settle
        if: github.event_name == 'workflow_run'
        run: sleep 45

      - name: Run cotización canary
        env:
          CANARY_BASE_URL: https://i-me.com.co
          PUBLIC_SUPABASE_URL: https://nnfbucwiasuggyfoyydo.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5nGmPS2W7yzG3B1NC7piCQ_Imt5f9b2
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CANARY_SMOKE_SECRET: ${{ secrets.CANARY_SMOKE_SECRET }}
        run: node scripts/canary-cotizacion.mjs
